name: Unit Tests

on:
  # Run on pushes to main only, so pushes to feature branches do not each
  # trigger a run. Feature work is tested when a pull request is opened/updated.
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# If a newer run starts for the same branch/PR, cancel the older one that is
# still in progress (the older result would be stale anyway).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v